# Démonstration locale, illustrative et en lecture seule : aucun entraînement.
host: 127.0.0.1
port: 8000
shapes_root: outputs/shapes
# Run « standard » deux tours inacheve (best.pt sans summary.json) : le checkpoint complet ci-
# dessous a la meme configuration effective, 40 robots et 1 200 iterations, seul le nom de profil differe.
training_root: outputs/training/size_40
horizon: 120
swarm_sizes: [20, 40, 100]
seed_max: 2147483647
default_seed: 142
# L'utilisateur choisit une figure, jamais un nombre de points (voir reference_points, config/shapes.yaml).
default_target: geometries_circle
default_swarm_size: 40
default_controller: manual
# Une seule version existante est utilisée ; aucun choix de checkpoint par l'API.
training_seeds: [11]
controllers:
  manual: {type: baseline}
  flocking: {type: baseline}
  gnn_2_rounds: {type: trained, variant: gnn_2_rounds}
