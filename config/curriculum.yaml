# Les niveaux conservent toutes les cibles des niveaux précédents, sans accès au test.
training_config: training
output: outputs/curriculum
resolution: 50
target_sampling: cyclic
transfer_checkpoint: best
forgetting_tolerance: 0.05
variants:
  gnn_3_rounds_id: {message_rounds: 3, use_target_geometry: false}
  gnn_3_rounds_geometry: {message_rounds: 3, use_target_geometry: true}
profiles:
  smoke:
    iterations: 20
    n_robots: 50
    horizon: 20
    validation_interval: 10
    seeds: [1]
    validation_seeds: [9001, 9002, 9003]
  standard:
    iterations: 1200
    n_robots: 50
    horizon: 120
    validation_interval: 50
    seeds: [11, 12, 13, 14, 15]
    validation_seeds: [9001, 9002, 9003]
levels:
  - name: geometries
    shape_types: [geometries]
  - name: digits
    shape_types: [digits]
  - name: letters
    shape_types: [letters]
  - name: numbers
    shape_types: [numbers]
