# Configuration du simulateur — toutes les règles dans docs/decisions/02-simulator.md
# Repère : arène carrée centrée sur l'origine ; unités du cadre commun normalisé (rayon de cible = 1).
arena_size: 4.0        # côté de l'arène carrée
dt: 0.1                # pas de temps
v_max: 1.0             # vitesse maximale (bornée avant mise à jour de position)
r_c: 1.5               # portée de communication
horizon: 60            # nombre de pas par épisode
failure_fraction: 0.0  # fraction de robots retirés à mi-épisode (0 = pas de panne)
record_positions: true # enregistrer les positions à chaque pas
spawn_radius: 1.8      # disque centré sur l'origine d'où sont tirées les positions initiales
