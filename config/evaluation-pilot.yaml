# Campagne recoverable avec les checkpoints deja entraines (gnn_1_round et gnn_2_rounds n'ont jamais abouti).
# Lancer avec --allow-partial : les variantes absentes sont consignees dans provenance.json, pas silencieusement omises.
# Budget mesure : ~0,72 s par episode GNN, done ~2 h CPU pour 8 unites x 1200 episodes.

evaluation_seed: 555      # memes graines d'episode que la campagne formelle (comparaison appariee)
seed_stride: 1000
training_seeds: [11, 12, 13, 14, 15]
repetitions: 50
evaluation_horizon: 120
swarm_sizes: [20, 40, 100]
failure_fractions: [0.0, 0.05, 0.1, 0.2]
shapes: [geometries_circle, geometries_star]
positions_per_condition: 5   # 5 trajectoires conservees par condition : le reste reste recalculable

controllers:
  flocking: {type: baseline}
  manual: {type: baseline}
  gnn_3_rounds: {type: trained, variant: gnn_3_rounds}
  no_comm: {type: trained, variant: no_comm}
