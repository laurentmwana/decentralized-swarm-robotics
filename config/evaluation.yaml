# Campagne d'evaluation phase 6 : une ligne par episode, 50 repetitions par condition.
# Regles : docs/decisions/06-evaluation.md. Budget : ~26 000 episodes CPU.

evaluation_seed: 555      # base des graines d'episode (figee, identique a tous les controleurs)
seed_stride: 1000
training_seeds: [11, 12, 13, 14, 15]
repetitions: 50
evaluation_horizon: 120     # marge au-delà des temps de convergence observes
swarm_sizes: [20, 40, 100]
failure_fractions: [0.0, 0.05, 0.1, 0.2]
shapes: [geometries_circle, geometries_star]
positions_per_condition: 50  # tous les épisodes restent recalculables depuis les positions

controllers:
  flocking: {type: baseline}
  manual: {type: baseline}
  gnn_1_round: {type: trained, variant: gnn_1_round}
  gnn_2_rounds: {type: trained, variant: gnn_2_rounds}
  gnn_3_rounds: {type: trained, variant: gnn_3_rounds}
  no_comm: {type: trained, variant: no_comm}
